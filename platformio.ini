; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    pierremolinaro/ACAN_ESP32
    pierremolinaro/ACAN2515
; Warning set chosen to catch logic mistakes rather than benign narrowing.
; -Wduplicated-branches in particular catches the "both arms of this if are
; identical" bug that shipped in request_data() for the balancing command byte.
build_flags =
    -Wall
    -Wextra
    -Wshadow
    -Wformat=2
    -Wlogical-op
    -Wduplicated-cond
    -Wduplicated-branches
    -Wnull-dereference
    -Wswitch-enum
    -Wuninitialized
    -Wreturn-type
